<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Burn Rate — Raise. Burn. Repeat.</title>
<meta name="description" content="Raise. Burn. Repeat. Burn Rate is coming soon from Burn Rate Games. Get early access.">
<meta name="theme-color" content="#1F2A44">
<link rel="canonical" href="https://burnrategames.com/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Burn Rate Games">
<meta property="og:title" content="Burn Rate — Raise. Burn. Repeat.">
<meta property="og:description" content="Coming soon from Burn Rate Games. Get early access.">
<meta property="og:url" content="https://burnrategames.com/">
<meta property="og:image" content="https://burnrategames.com/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Burn Rate logo in clay: a rising line that crashes into a flame">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Burn Rate — Raise. Burn. Repeat.">
<meta name="twitter:description" content="Coming soon from Burn Rate Games. Get early access.">
<meta name="twitter:image" content="https://burnrategames.com/img/og.jpg">
<link rel="icon" href="img/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preload" href="fonts/permanent-marker.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <h1 class="logo">
    <img src="img/logo.webp" width="1008" height="483" alt="Burn Rate">
  </h1>
  <p class="tag">Raise. Burn. Repeat.</p>
  <p class="soon">Coming soon from Burn Rate Games.</p>

  <form id="signup" class="signup" action="https://app.kit.com/forms/10079919/subscriptions" method="post">
    <label class="sr-only" for="email">Email address</label>
    <div class="row">
      <input id="email" type="email" name="email_address" placeholder="you@startup.com" autocomplete="email" required>
      <button type="submit">Get early access</button>
    </div>
    <div class="hp" aria-hidden="true"><input type="text" name="hp_x" tabindex="-1" autocomplete="off"></div>
    <p id="status" class="status" role="status" aria-live="polite"></p>
    <p class="consent">Get launch news from Burn Rate Games. Unsubscribe anytime. <a href="privacy.html">Privacy</a></p>
  </form>
</main>
<footer class="foot">© 2026 Burn Rate Games · <a href="privacy.html">Privacy</a> · <a href="mailto:hello@burnrategames.com">hello@burnrategames.com</a></footer>
<script>
(() => {
  const form = document.getElementById('signup');
  const status = document.getElementById('status');
  const button = form.querySelector('button');
  const say = (msg, kind) => { status.textContent = msg; status.dataset.kind = kind || ''; };

  let busy = false;

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (busy) return;
    const data = new FormData(form);
    if (data.get('hp_x')) { say('Check your inbox to confirm.', 'ok'); return; } // bot: drop silently
    data.delete('hp_x');
    busy = true;
    button.setAttribute('aria-disabled', 'true');
    say('Sending…');
    let json = {};
    try {
      const res = await fetch(form.action, { method: 'POST', body: data, headers: { Accept: 'application/json' } });
      json = await res.json().catch(() => ({}));
      if (json.status === 'quarantined' && json.url) { location.href = json.url; return; } // Kit's captcha step
      if (res.ok && json.status === 'success') { form.reset(); say('Check your inbox to confirm.', 'ok'); return; }
    } catch {}
    finally {
      busy = false;
      button.removeAttribute('aria-disabled');
    }
    const kitError = (json.errors || [])[0];
    say(typeof kitError === 'string' ? kitError : 'Something broke. Try again.', 'err');
  });
})();
</script>
</body>
</html>
